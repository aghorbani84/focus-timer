<!doctype html>
<html lang="en" data-style="modern" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer v2 — Pomodoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (no white flash).
      // Jotai's atomWithStorage stores JSON, so parse defensively.
      try {
        var read = function (k) {
          var v = localStorage.getItem(k);
          if (v == null) return null;
          try { return JSON.parse(v); } catch (e) { return v; }
        };
        var s = read('showcase-style');
        var m = read('showcase-mode');
        if (m !== 'light' && m !== 'dark') {
          m = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.setAttribute(
          'data-style',
          s === 'achaemenid' ? 'achaemenid' : 'modern',
        );
        document.documentElement.setAttribute('data-mode', m);
      } catch (e) {
        document.documentElement.setAttribute('data-style', 'modern');
        document.documentElement.setAttribute('data-mode', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
